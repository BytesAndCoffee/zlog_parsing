[package]
name = "irc_log_parser"
version = "0.1.0"
edition = "2021"

[lib]
name = "irc_log_parser"
path = "src/lib.rs"

[[bin]]
name = "irc_log_parser"
path = "src/main.rs"

[dependencies]
sqlx = { version = "0.7", features = ["mysql", "runtime-tokio", "chrono", "tls-rustls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
dotenvy = "0.15"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"

[dev-dependencies]
proptest = "1"
serial_test = "3"

# Cross-compilation target: x86_64 Linux from Apple Silicon macOS
# Build with: cargo build --target x86_64-unknown-linux-gnu --release
[target.x86_64-unknown-linux-gnu]
